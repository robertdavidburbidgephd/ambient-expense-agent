[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "submission-frontend"
version = "0.1.0"
description = "Manager Dashboard – approval frontend for the ambient expense agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-adk>=1.0.0",
    "google-cloud-aiplatform>=1.70.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
serve = "main:app"

[tool.setuptools.packages.find]
where = ["."]
